[workspace]
members = ["crates/workshop-api", "crates/workshop-tauri"]
resolver = "2"
default-members = ["crates/workshop-tauri"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
walkdir = "2"
notify = "6"
notify-debouncer-mini = "0.4"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
async-stream = "0.3"
bytes = "1"

metalcraft-flows = "0.2.1"

[profile.release]
strip = true
lto = true
codegen-units = 1
