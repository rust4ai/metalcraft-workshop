[workspace]
members = ["crates/workshop-api", "crates/workshop-tauri"]
resolver = "2"
default-members = ["crates/workshop-tauri"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
walkdir = "2"
notify = "6"
notify-debouncer-mini = "0.4"

metalcraft-flows = { git = "https://github.com/rust4ai/metalcraft-flows", rev = "a6e8e2e55853d8138fe0fbf89b6a0fd37877cf1d" }

[profile.release]
strip = true
lto = true
codegen-units = 1
